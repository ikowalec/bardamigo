name: Release BarDaMIgo System

on:
  push:
    tags:
      - 'v*'

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build system
        run: npm run build

      - name: Extract Tag & Version
        id: get_version
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          VERSION=${TAG#v}
          echo "tag=$TAG" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update system.json Version & URLs
        run: |
          TAG="${{ steps.get_version.outputs.tag }}"
          VERSION="${{ steps.get_version.outputs.version }}"
          REPO="${{ github.repository }}"
          node -e "
            const fs = require('fs');
            const manifestPath = 'dist/system.json';
            const manifest = JSON.parse(fs.readFileSync(manifestPath, 'utf8'));
            manifest.version = '$VERSION';
            manifest.url = 'https://github.com/$REPO';
            manifest.manifest = 'https://github.com/$REPO/releases/latest/download/system.json';
            manifest.download = 'https://github.com/$REPO/releases/download/$TAG/bardamigo.zip';
            fs.writeFileSync(manifestPath, JSON.stringify(manifest, null, 2));
          "

      - name: Create Zip Package
        run: |
          cd dist
          zip -r ../bardamigo.zip ./*
          cd ..

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag }}
          name: BarDaMIgo ${{ steps.get_version.outputs.tag }}
          draft: false
          prerelease: false
          files: |
            dist/system.json
            bardamigo.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
